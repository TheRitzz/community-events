<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Events</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <h1><i class="fas fa-users"></i> Community Events</h1>
  </nav>

  <!-- FILTERS -->
  <div class="filters">
    <div class="filter-item">
      <i class="fas fa-tags"></i>
      <select id="typeFilter">
        <option value="">All Types</option>
        <option>Workshop</option>
        <option>Music</option>
        <option>Sports</option>
        <option>Meetup</option>
        <option>Fitness</option>
        <option>Entertainment</option>
        <option>Social</option>
      </select>
    </div>

    <div class="filter-item">
      <i class="fas fa-calendar-alt"></i>
      <input type="date" id="dateFilter">
    </div>

    <div class="filter-item">
      <i class="fas fa-map-marker-alt"></i>
      <input type="text" id="locationFilter" placeholder="Location">
    </div>

    <button id="applyFilters"><i class="fas fa-check"></i> Apply</button>
    <button id="clearFilters"><i class="fas fa-times"></i> Clear</button>
  </div>

  <!-- EVENTS GRID -->
  <div class="events-grid" id="eventsGrid"></div>

  <!-- EVENT DETAILS MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent">
      <h2 id="modalTitle"></h2>
      <p id="modalType"></p>
      <p id="modalDate"></p>
      <p id="modalLocation"></p>
      <p id="modalHost"></p>
      <p id="modalDesc"></p>
      <button id="joinBtn"><i class="fas fa-sign-in-alt"></i> Join</button>
      <button onclick="closeModal()" style="margin-left:1rem;"><i class="fas fa-times"></i> Close</button>
    </div>
  </div>

  <!-- JOIN DETAILS FORM MODAL -->
  <div class="modal" id="formModal">
    <div class="modal-content" id="formContent">
      <h2><i class="fas fa-user-edit"></i> Enter Your Details</h2>
      <form id="joinForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="number" id="age" placeholder="Age" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="tel" id="contact" placeholder="Contact Number" required>
        <textarea id="note" placeholder="Additional Notes (Optional)"></textarea>
        <div style="margin-top:1rem;">
          <button type="submit"><i class="fas fa-paper-plane"></i> Submit</button>
          <button type="button" onclick="closeForm()"><i class="fas fa-times"></i> Close</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
